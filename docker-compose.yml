# 一键启动前后端：docker compose up -d --build
# 前端(nginx) 暴露 80 端口并反代 /api、/uploads 到后端；后端只在内网暴露。
services:
  backend:
    build: ./backend
    image: party2web-backend
    restart: unless-stopped
    # 管理员密码与密钥从 backend/.env 读取（部署前务必创建，见 DEPLOYMENT.md A4）
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    volumes:
      # 持久化 SQLite 数据库与上传文件
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    image: party2web-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 左边是宿主机端口，按需改为 8080:80 等
      - "80:80"
